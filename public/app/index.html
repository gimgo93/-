<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="공식 공개자료에서 확인한 정책을 쉽게 읽고, 적용 지역을 지도와 Google Earth에서 살펴보세요."
    />
    <meta name="theme-color" content="#f5f8fc" />
    <title>sepol (search politics) | 동네에서 찾는 정책</title>
    <link rel="icon" href="/app/icon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/app/fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/app/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/app/policy.css?v=2" />
    <script src="/app/vendor/leaflet/leaflet.js" defer></script>
    <script src="/app/policy-app.js?v=2" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="/app/" aria-label="sepol 정책 홈"
          ><span class="brand-mark"
            ><svg class="icon" aria-hidden="true">
              <use href="/app/icons.svg#map-pin"></use></svg></span
          >sepol<span class="brand-description"
            >search politics · 동네에서 찾는 정책</span
          ></a
        >
        <button class="button primary compact" data-view="write">
          <svg class="icon" aria-hidden="true">
            <use href="/app/icons.svg#plus"></use></svg
          >의견 남기기
        </button>
      </div>
      <div class="nav-inner">
        <nav aria-label="주요 메뉴">
          <a href="?view=discover" data-view="discover">정책 둘러보기</a>
          <a href="?view=map" data-view="map">정책 지도</a>
          <a href="?view=compare" data-view="compare"
            >비교·검토 <span id="saved-count">0</span></a
          >
          <a href="?view=opinions" data-view="opinions">시민 의견</a>
          <a href="?view=sources" data-view="sources">출처와 가공</a>
        </nav>
        <span class="review-stamp"
          >공식자료 검토 <time id="reviewed-date">확인 중</time></span
        >
      </div>
    </header>
    <section id="neighborhood-bar" aria-label="우리 동네 설정"></section>
    <main id="workspace" tabindex="-1">
      <div class="loading-state" role="status">
        <h1>정책의 근거를 불러오고 있어요.</h1>
        <p>공식 발표와 적용 지역을 함께 확인합니다.</p>
      </div>
    </main>
    <noscript
      ><p class="notice">
        정책 목록과 지도를 이용하려면 JavaScript를 켜 주세요.
        <a href="/app/api/policies">공개 정책 JSON 보기</a>
      </p></noscript
    >
    <footer class="site-footer">
      <strong>sepol</strong
      ><span>공식 발표를 읽기 쉽게 재구성한 독립 정책 탐색 서비스</span
      ><a href="?view=sources" data-view="sources">데이터와 지도 기준</a>
    </footer>
    <dialog id="policy-dialog" aria-labelledby="dialog-title">
      <div class="dialog-top">
        <h2 id="dialog-title"></h2>
        <button
          class="icon-button"
          data-action="close-dialog"
          aria-label="닫기"
        >
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <dialog
      id="neighborhood-dialog"
      aria-labelledby="neighborhood-title"
    ></dialog>
    <p id="toast" role="status" aria-live="polite"></p>
  </body>
</html>
