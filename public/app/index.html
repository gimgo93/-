<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="새로운 앱을 준비하는 공간입니다.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4f5f0">
  <title>새로운 시작 · App</title>
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/style.css">
</head>
<body>
  <div class="shell">
    <header class="header">
      <a class="brand" href="/app/" aria-label="앱 홈">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="4"/><rect x="18" y="2" width="12" height="12" rx="4"/><rect x="2" y="18" width="12" height="12" rx="4"/><path d="M24 19v10m-5-5h10"/></svg>
        <span>app<span class="brand-dot">.</span></span>
      </a>
      <span class="status"><span aria-hidden="true"></span>준비 중</span>
    </header>
    <main>
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">A NEW BEGINNING</p>
        <h1 id="title">다음 아이디어가<br>시작되는 곳<span class="accent">.</span></h1>
        <p class="description">새로운 앱을 만들고 있습니다.<br>작은 아이디어가 일상의 새로운 경험이 될 때까지.</p>
        <div class="progress-note"><span class="note-line" aria-hidden="true"></span>첫 번째 이야기를 준비하고 있어요.</div>
      </section>
      <div class="canvas" aria-hidden="true">
        <div class="canvas-grid"></div>
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
        <div class="tile tile-small"><span></span><span></span><span></span></div>
        <div class="tile tile-main">
          <div class="tile-top"><span></span><i></i></div>
          <svg class="spark" viewBox="0 0 100 100"><path d="M50 6c3 28 16 41 44 44-28 3-41 16-44 44C47 66 34 53 6 50 34 47 47 34 50 6Z"/></svg>
          <div class="tile-bottom"><span></span><span></span></div>
        </div>
        <div class="tile tile-plus">+</div>
        <span class="canvas-caption">ROOM FOR SOMETHING NEW</span>
      </div>
    </main>
    <footer><span>아이디어에서, 일상으로.</span><span>APP / 001</span></footer>
  </div>
</body>
</html>
